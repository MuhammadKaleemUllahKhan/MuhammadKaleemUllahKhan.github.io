<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Muhammad KaleemUllah Khan">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="55%" stop-color="#21d4fd"/>
      <stop offset="100%" stop-color="#ff5c8a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <rect width="320" height="320" rx="160" fill="url(#bg)"/>
  <rect width="320" height="320" rx="160" fill="url(#glow)"/>

  <!-- subtle node/network motif (federated learning nod) -->
  <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="2" fill="none">
    <path d="M70 235 L160 120 L250 235 M160 120 L160 70 M70 235 L160 70 M250 235 L160 70"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.85">
    <circle cx="160" cy="70" r="8"/>
    <circle cx="70" cy="235" r="7"/>
    <circle cx="250" cy="235" r="7"/>
    <circle cx="160" cy="120" r="6"/>
  </g>

  <!-- Initials -->
  <text x="160" y="205" text-anchor="middle"
        font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif"
        font-size="120" font-weight="800" fill="#ffffff" letter-spacing="-4">MK</text>

  <circle cx="160" cy="160" r="156" fill="none" stroke="url(#ring)" stroke-width="3"/>
</svg>
